    <text x="56" y="148" fill="#080808">Browser</text><text x="356" y="148">Files</text><text x="656" y="148">Live TV</text>
    <text x="56" y="212">Music</text><text x="356" y="212">Netflix</text><text x="656" y="212">Photos</text>
    <text x="56" y="276">Plex</text><text x="356" y="276">Prime Video</text><text x="656" y="276">YouTube</text>
